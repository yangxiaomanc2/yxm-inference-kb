<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识页 · YXM 知识库</title>
<style>
:root{--bg:#faf9f5;--surface:#ffffff;--ink:#141413;--muted:#6b6a65;--line:#e8e6dc;
--accent:#d97757;--accent-2:#f38020;--soft:#f0eee6;
--serif:"Tiempos Headline",Georgia,"Songti SC","Noto Serif SC",serif;
--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;
-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:12px;align-items:center;min-height:56px;flex-wrap:wrap;padding:8px 24px}
.bar .site{font-family:var(--serif);font-size:16px;color:var(--ink);margin-right:auto}
.bar .site:hover{text-decoration:none;color:var(--accent)}
.btn{font:inherit;font-size:13px;cursor:pointer;border-radius:999px;padding:7px 15px;
border:1px solid var(--ink);background:transparent;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.on{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.hero{padding:88px 0 0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1.t{font-family:var(--serif);font-weight:500;letter-spacing:-.02em;
font-size:clamp(32px,5vw,60px);line-height:1.12;margin:18px 0 0}
.lead{color:var(--muted);max-width:46ch;margin-top:18px;font-size:16px}
.facts{display:flex;flex-wrap:wrap;gap:40px;margin-top:40px;padding-top:28px;
border-top:1px solid var(--line)}
.facts .v{font-family:var(--serif);font-size:clamp(24px,3.4vw,38px);color:var(--accent);line-height:1.1}
.facts .l{font-size:12px;color:var(--muted);margin-top:6px}
.banner{background:var(--soft);border-left:3px solid var(--accent-2);padding:12px 16px;
font-size:13px;color:var(--muted);margin-top:24px;border-radius:0 8px 8px 0}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:56px;
align-items:start;margin-top:64px}
.toc{position:sticky;top:84px;max-height:calc(100vh - 120px);overflow:auto;
font-size:13px;border-left:1px solid var(--line);padding-left:16px}
.toc .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
color:var(--muted);margin-bottom:12px}
.toc a{display:block;color:var(--muted);padding:4px 0;line-height:1.45}
.toc a:hover{color:var(--ink);text-decoration:none}
.toc a.l3{padding-left:14px;font-size:12.5px}
.toc a.on{color:var(--accent)}
article{min-width:0;font-size:15.5px}
article h2{font-family:var(--serif);font-weight:500;font-size:clamp(24px,3vw,32px);
letter-spacing:-.01em;margin:64px 0 16px;padding-top:8px;scroll-margin-top:76px}
article h2:first-child{margin-top:0}
article h3{font-family:var(--serif);font-weight:500;font-size:20px;
margin:40px 0 12px;scroll-margin-top:76px}
article h4{font-size:15px;font-weight:600;margin:28px 0 10px}
article p{margin:14px 0}
article ul,article ol{margin:14px 0 14px 22px}
article li{margin:6px 0}
article li>ul,article li>ol{margin:6px 0 6px 18px}
article strong{font-weight:600}
article code{font-family:var(--mono);font-size:.88em;background:var(--soft);
border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-word}
article pre{background:var(--surface);border:1px solid var(--line);border-radius:12px;
padding:18px 20px;overflow-x:auto;margin:20px 0}
article pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.6;white-space:pre}
article blockquote{background:var(--soft);border-left:3px solid var(--accent);
border-radius:0 10px 10px 0;padding:14px 18px;margin:20px 0;color:var(--muted);font-size:14.5px}
article hr{border:0;border-top:1px solid var(--line);margin:44px 0}
.tw{overflow-x:auto;margin:20px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
article table{border-collapse:collapse;width:100%;font-size:13.5px}
article th,article td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
article th{background:var(--soft);font-weight:600;white-space:nowrap}
article tbody tr:last-child td{border-bottom:0}
.editor{display:none;margin-top:24px}
body.edit .editor{display:block}
body.edit article{display:none}
.editor textarea{width:100%;min-height:68vh;font:13px/1.7 var(--mono);color:var(--ink);
background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;resize:vertical}
.editor .row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.editor .pri{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.editor .hint{margin-right:auto;font-size:12px;color:var(--muted);align-self:center}
footer{border-top:1px solid var(--line);margin-top:72px;padding:28px 0 56px;
color:var(--muted);font-size:12.5px}
footer p+p{margin-top:4px}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:32px}
.toc{position:static;max-height:none;border-left:0;border-top:1px solid var(--line);
padding:16px 0 0;columns:2}}
@media(max-width:600px){.hero{padding-top:56px}.facts{gap:24px}
.wrap{padding:0 18px}article{font-size:15px}.toc{columns:1}
.bar .wrap{padding:8px 18px}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="site" href="./index.html">YXM 知识库</a>
  <button class="btn" id="toggle">编辑</button>
  <button class="btn" id="export">导出</button>
</div></header>

<section class="hero wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 class="t" id="title">正在读取…</h1>
  <p class="lead" id="lead"></p>
  <div class="facts" id="facts"></div>
  <div class="banner" id="banner" hidden></div>
</section>

<main class="wrap layout">
  <aside class="toc"><div class="cap">本页目录</div><div id="toc"></div></aside>
  <div>
    <article id="body"></article>
    <div class="editor">
      <textarea id="md" spellcheck="false"></textarea>
      <div class="row">
        <span class="hint">内容存在 Supabase，保存后所有打开这页的设备即时更新</span>
        <button class="btn" id="cancel">放弃修改</button>
        <button class="btn pri" id="save">保存</button>
      </div>
    </div>
  </div>
</main>

<footer class="wrap">
  <p id="foot"></p>
  <p>正文以 markdown 存在 Supabase，任何人可在线编辑；请只放公开信息。</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://jfvktpiumonhsgsgwbcc.supabase.co';
const SB_KEY='sb_publishable_iwjdJ0BVThvZVEpq2t2tgw_OskNS6U1';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const SLUG=(new URLSearchParams(location.search).get('p')||'').replace(/[^a-z0-9-]/gi,'');
const PAGE='yxm-kb-'+SLUG;

/* ---------- markdown 渲染：先转义，再按白名单还原，绝不拼接原始 HTML ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function inline(text){
  const holes=[];
  const stash=m=>{holes.push(m);return '\u0000'+(holes.length-1)+'\u0000';};
  let t=esc(text);
  t=t.replace(/`([^`]+)`/g,(m,a)=>stash('<code>'+a+'</code>'));
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (m,a,b)=>stash('<a href="'+b.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">'+a+'</a>'));
  t=t.replace(/\*\*([^*]+)\*\*/g,(m,a)=>stash('<strong>'+a+'</strong>'));
  return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>holes[+i]);
}

function slugify(text,used){
  let s=text.trim().toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g,'-').replace(/^-+|-+$/g,'')||'sec';
  let out=s,n=2;
  while(used.has(out)){out=s+'-'+n;n++;}
  used.add(out);
  return out;
}

function cells(line){
  let s=line.trim();
  if(s.startsWith('|'))s=s.slice(1);
  if(s.endsWith('|'))s=s.slice(0,-1);
  return s.split('|').map(c=>c.trim());
}

function table(rows){
  const head=cells(rows[0]);
  const aligns=cells(rows[1]).map(spec=>{
    const l=spec.startsWith(':'),r=spec.endsWith(':');
    return (l&&r)?'center':r?'right':'left';
  });
  let out='<div class="tw"><table><thead><tr>';
  head.forEach((c,i)=>{out+='<th style="text-align:'+(aligns[i]||'left')+'">'+inline(c)+'</th>';});
  out+='</tr></thead><tbody>';
  rows.slice(2).forEach(line=>{
    out+='<tr>';
    cells(line).forEach((c,i)=>{out+='<td style="text-align:'+(aligns[i]||'left')+'">'+inline(c)+'</td>';});
    out+='</tr>';
  });
  return out+'</tbody></table></div>';
}
function listBlock(items,tag){
  const top=[];
  items.forEach(([indent,text])=>{
    if(indent>=2&&top.length)top[top.length-1][1].push(text);
    else top.push([text,[]]);
  });
  let out='<'+tag+'>';
  top.forEach(([text,kids])=>{
    out+='<li>'+inline(text);
    if(kids.length){out+='<'+tag+'>'+kids.map(k=>'<li>'+inline(k)+'</li>').join('')+'</'+tag+'>';}
    out+='</li>';
  });
  return out+'</'+tag+'>';
}

/* 返回 {title, html, toc:[[level,id,text]]} */
function renderMd(md){
  const lines=String(md||'').replace(/\r\n/g,'\n').split('\n');
  const out=[],toc=[],used=new Set();
  let title='',i=0;
  const n=lines.length;
  const BLOCK=/^(#{1,4}\s|```|\s*\||>|---+\s*$|\s*([-*]|\d+\.)\s)/;
  while(i<n){
    const line=lines[i];
    if(line.startsWith('```')){
      const lang=line.slice(3).trim();
      const buf=[];i++;
      while(i<n&&!lines[i].startsWith('```')){buf.push(lines[i]);i++;}
      i++;
      out.push('<pre'+(lang?' class="lang-'+esc(lang)+'"':'')+'><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }
    const h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){
      const lv=h[1].length,text=h[2].trim();
      if(lv===1&&!title){title=text.replace(/[`*]/g,'');i++;continue;}
      const id=slugify(text,used);
      if(lv===2||lv===3)toc.push([lv,id,text.replace(/[`*]/g,'')]);
      out.push('<h'+lv+' id="'+id+'">'+inline(text)+'</h'+lv+'>');
      i++;continue;
    }
    if(/^\s*\|/.test(line)&&i+1<n&&/^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1])){
      const rows=[];
      while(i<n&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      out.push(table(rows));continue;
    }
    if(/^(---+|\*\*\*+)\s*$/.test(line)){out.push('<hr>');i++;continue;}
    if(line.startsWith('>')){
      const buf=[];
      while(i<n&&lines[i].startsWith('>')){buf.push(lines[i].replace(/^>+/,'').trim());i++;}
      out.push('<blockquote>'+inline(buf.filter(Boolean).join(' '))+'</blockquote>');continue;
    }
    const li=line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if(li){
      const tag=/\d+\./.test(li[2])?'ol':'ul';
      const items=[];
      while(i<n){
        const mm=lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if(!mm){
          if(lines[i].trim()&&items.length&&/^(\s\s|\t)/.test(lines[i])){
            items[items.length-1][1]+=' '+lines[i].trim();i++;continue;
          }
          break;
        }
        items.push([mm[1].length,mm[3]]);i++;
      }
      out.push(listBlock(items,tag));continue;
    }
    if(!line.trim()){i++;continue;}
    const buf=[];
    while(i<n&&lines[i].trim()&&!BLOCK.test(lines[i])){buf.push(lines[i].trim());i++;}
    out.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  return {title:title,html:out.join('\n'),toc:toc};
}

/* ---------- 正文统计：只数正文，不数代码块内部 ---------- */
function stats(md){
  const lines=String(md||'').split('\n');
  let inside=false,fences=0,tables=0;
  const body=[];
  lines.forEach(ln=>{
    if(ln.startsWith('```')){fences++;inside=!inside;return;}
    if(inside)return;
    body.push(ln);
    if(/^\s*\|[\s:|-]+\|?\s*$/.test(ln))tables++;
  });
  const text=body.join('\n');
  const chars=text.replace(/\s+/g,'').length;
  return [
    ['字数',chars>=1000?Math.floor(chars/1000)+'k':String(chars)],
    ['章节',String((text.match(/^## /gm)||[]).length)],
    ['表格',String(tables)],
    ['代码块',String(Math.floor(fences/2))]
  ];
}

function banner(msg){const b=$('#banner');b.hidden=false;b.textContent=msg;}
let row=null,io=null;

function paint(d){
  const r=renderMd(d.md);
  const title=d.title||r.title||'未命名知识页';
  document.title=title+' · YXM 知识库';
  $('#eyebrow').textContent=d.eyebrow||'YXM 知识库';
  $('#title').textContent=title;
  $('#lead').textContent=d.lead||'';
  const f=$('#facts');f.textContent='';
  stats(d.md).forEach(([k,v])=>{
    const w=document.createElement('div');
    const vv=document.createElement('div');vv.className='v';vv.textContent=v;
    const ll=document.createElement('div');ll.className='l';ll.textContent=k;
    w.append(vv,ll);f.appendChild(w);
  });
  $('#body').innerHTML=r.html;
  const toc=$('#toc');toc.textContent='';
  r.toc.forEach(([lv,id,text])=>{
    const a=document.createElement('a');
    a.className='l'+lv;a.href='#'+id;a.textContent=text;
    toc.appendChild(a);
  });
  $('#md').value=d.md||'';
  $('#foot').textContent='来源：各项目仓库源码、官方技术报告与公开资料；标注「工程推断」的段落为作者推断。';
  spy();
}

function spy(){
  if(io)io.disconnect();
  const links=[...document.querySelectorAll('#toc a')];
  const map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
  io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(!e.isIntersecting)return;
      links.forEach(a=>a.classList.remove('on'));
      const a=map.get(e.target.id);
      if(a)a.classList.add('on');
    });
  },{rootMargin:'-76px 0px -70% 0px',threshold:0});
  document.querySelectorAll('#body h2[id],#body h3[id]').forEach(h=>io.observe(h));
}

async function load(){
  if(!SLUG){$('#title').textContent='缺少参数 p';banner('网址里需要带 ?p=<知识页标识>，例如 article.html?p=deepinfer');return;}
  const {data,error}=await sb.from('pages_blocks').select('*').eq('page',PAGE).order('sort');
  if(error){$('#title').textContent='读取失败';banner('读取失败：'+error.message);return;}
  if(!data||!data.length){$('#title').textContent='这页还没有内容';
    banner('Supabase 里没有 page='+PAGE+' 的记录。点「编辑」可以直接写入第一版。');
    row={id:null,page:PAGE,section:'article',sort:0,data:{}};paint({md:''});return;}
  row=data[0];paint(row.data||{});
}
$('#toggle').onclick=()=>{
  const on=document.body.classList.toggle('edit');
  $('#toggle').classList.toggle('on',on);
  $('#toggle').textContent=on?'预览':'编辑';
};
$('#cancel').onclick=()=>{
  $('#md').value=(row&&row.data&&row.data.md)||'';
  $('#toggle').click();
};
$('#save').onclick=async()=>{
  const md=$('#md').value;
  const d=Object.assign({},(row&&row.data)||{},{md:md});
  let error;
  if(row&&row.id){({error}=await sb.from('pages_blocks').update({data:d}).eq('id',row.id));}
  else{({error}=await sb.from('pages_blocks').insert({page:PAGE,section:'article',sort:0,data:d}));}
  if(error){banner('保存失败：'+error.message);return;}
  $('#banner').hidden=true;
  await load();
  if(document.body.classList.contains('edit'))$('#toggle').click();
};
$('#export').onclick=()=>{
  const md=(row&&row.data&&row.data.md)||$('#md').value||'';
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(SLUG||'article')+'.md';
  a.click();
};

sb.channel('kb-'+PAGE)
  .on('postgres_changes',{event:'*',schema:'public',table:'pages_blocks'},()=>{
    if(!document.body.classList.contains('edit'))load();
  })
  .subscribe();
load();
</script>
</body>
</html>
