<script>
const SB_URL='https://jfvktpiumonhsgsgwbcc.supabase.co';

const SLUG=(new URLSearchParams(location.search).get('p')||'').replace(/[^a-z0-9-]/gi,'');
const PAGE='yxm-kb-'+SLUG;
document.body.classList.toggle('flash-page',SLUG==='flash');

/* ---------- markdown 渲染：先转义，再按白名单还原，绝不拼接原始 HTML ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function inline(text){
  const holes=[];
  const stash=m=>{holes.push(m);return '\u0000'+(holes.length-1)+'\u0000';};
  let t=esc(text).replace(/\u0000/g,'\ufffd');
  t=t.replace(/`([^`]+)`/g,(m,a)=>stash('<code>'+a+'</code>'));
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)\u0000]+)\)/g,
    (m,a,b)=>stash('<a href="'+b.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">'+a.replace(/\u0000(\d+)\u0000/g,(_,i)=>holes[+i])+'</a>'));
  t=t.replace(/\*\*([^*]+)\*\*/g,(m,a)=>stash('<strong>'+a+'</strong>'));
  return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>holes[+i]);
}

function slugify(text,used){
  let s=text.trim().toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g,'-').replace(/^-+|-+$/g,'')||'sec';
  let out=s,n=2;
  while(used.has(out)){out=s+'-'+n;n++;}
  used.add(out);
  return out;
}

function cells(line){
  let s=line.trim();
  if(s.startsWith('|'))s=s.slice(1);
  if(s.endsWith('|'))s=s.slice(0,-1);
  return s.split('|').map(c=>c.trim());
}

function table(rows){
  const head=cells(rows[0]);
  const aligns=cells(rows[1]).map(spec=>{
    const l=spec.startsWith(':'),r=spec.endsWith(':');
    return (l&&r)?'center':r?'right':'left';
  });
  let out='<div class="tw"><table><thead><tr>';
  head.forEach((c,i)=>{out+='<th style="text-align:'+(aligns[i]||'left')+'">'+inline(c)+'</th>';});
  out+='</tr></thead><tbody>';
  rows.slice(2).forEach(line=>{
    out+='<tr>';
    cells(line).forEach((c,i)=>{out+='<td style="text-align:'+(aligns[i]||'left')+'">'+inline(c)+'</td>';});
    out+='</tr>';
  });
  return out+'</tbody></table></div>';
}
function listBlock(items,tag){
  const top=[];
  items.forEach(([indent,text])=>{
    if(indent>=2&&top.length)top[top.length-1][1].push(text);
    else top.push([text,[]]);
  });
  let out='<'+tag+'>';
  top.forEach(([text,kids])=>{
    out+='<li>'+inline(text);
    if(kids.length){out+='<'+tag+'>'+kids.map(k=>'<li>'+inline(k)+'</li>').join('')+'</'+tag+'>';}
    out+='</li>';
  });
  return out+'</'+tag+'>';
}

/* 返回 {title, html, toc:[[level,id,text]]}；以 anchors[k] 开头的代码块输出为图位 data-fig=k */
function renderMd(md,anchors=[]){
  const lines=String(md||'').replace(/\r\n/g,'\n').split('\n');
  const out=[],toc=[],used=new Set();
  let title='',i=0;
  const n=lines.length;
  const BLOCK=/^(#{1,4}\s|```|\s*\||>|---+\s*$|\s*([-*]|\d+\.)\s)/;
  while(i<n){
    const line=lines[i];
    if(line.startsWith('```')){
      const lang=line.slice(3).trim();
      const buf=[];i++;
      while(i<n&&!lines[i].startsWith('```')){buf.push(lines[i]);i++;}
      i++;
      const slot=anchors.findIndex(a=>buf.join('\n').startsWith(a));
      if(slot>=0){out.push('<div class="fig-slot" data-fig="'+slot+'"></div>');continue;}
      out.push('<pre'+(/^[\w+-]+$/.test(lang)?' class="lang-'+lang+'"':'')+'><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }
    const h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){
      const lv=h[1].length,text=h[2].trim();
      if(lv===1&&!title){title=text.replace(/[`*]/g,'');i++;continue;}
      const id=slugify(text,used);
      if(lv===2||lv===3)toc.push([lv,id,text.replace(/[`*]/g,'')]);
      out.push('<h'+lv+' id="'+id+'">'+inline(text)+'</h'+lv+'>');
      i++;continue;
    }
    if(/^\s*\|/.test(line)&&i+1<n&&/^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1])){
      const rows=[];
      while(i<n&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      out.push(table(rows));continue;
    }
    if(/^(---+|\*\*\*+)\s*$/.test(line)){out.push('<hr>');i++;continue;}
    if(line.startsWith('>')){
      const buf=[];
      while(i<n&&lines[i].startsWith('>')){buf.push(lines[i].replace(/^>+/,'').trim());i++;}
      out.push('<blockquote>'+inline(buf.filter(Boolean).join(' '))+'</blockquote>');continue;
    }
    const li=line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if(li){
      const tag=/\d+\./.test(li[2])?'ol':'ul';
      const items=[];
      while(i<n){
        const mm=lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if(!mm){
          if(lines[i].trim()&&items.length&&/^(\s\s|\t)/.test(lines[i])){
            items[items.length-1][1]+=' '+lines[i].trim();i++;continue;
          }
          break;
        }
        items.push([mm[1].length,mm[3]]);i++;
      }
      out.push(listBlock(items,tag));continue;
    }
    if(!line.trim()){i++;continue;}
    const buf=[];
    while(i<n&&lines[i].trim()&&!BLOCK.test(lines[i])){buf.push(lines[i].trim());i++;}
    if(!buf.length){buf.push(line.trim());i++;}
    out.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  return {title:title,html:out.join('\n'),toc:toc};
}

function readingCopy(md){
  const text=String(md||'').replace(/\r\n/g,'\n');
  const firstSection=text.search(/^## /m);
  if(firstSection<0 || !['deepinfer','flash','harness','openrsi'].includes(SLUG))return text;
  let intro=text.slice(0,firstSection);
  if(SLUG==='deepinfer')intro=intro
    .replace(/^> (?:读者|源码版本|模型配置|文中路径).*$/gm,'')
    .replace(/^\*\*标注约定\*\*\n\n(?:- [^\n]*\n){3}/m,'')
    .replace(/^---\s*$/m,'\n');
  if(SLUG==='flash')intro=intro.replace(/^> (?:更新时间|主要依据|约定).*$/gm,'');
  return intro+text.slice(firstSection)
    .replace(/^本文的代码片段都来自 .+路径相对各自仓库根目录。.+$/gm,'')
    .replace(/^本文基于仓库 commit .+阅读源码。除标注 .+$/gm,'');
}

function banner(msg){const b=$('#banner');b.hidden=false;b.textContent=msg;}
let row=null,io=null,painted=false;

function paint(d,figures=[],notes=''){
  const anchors=figures.map(f=>typeof f.anchor==='string'&&f.anchor?f.anchor:'\u0000');
  const r=renderMd(readingCopy(d.md),anchors);
  const title=d.title||r.title||'未命名知识页';
  document.title=title+' · YXM 知识库';
  $('#title').textContent=title;
  $('#lead').textContent=d.lead||'';
  const body=$('#body');
  body.querySelectorAll('.kb-figure').forEach(fig=>fig.disposeFigure?.());
  body.innerHTML=r.html;
  // 正文里找不到对应代码块的图（含概览图）放在正文前，图号按页面中出现的顺序编排
  const placed=new Set([...body.querySelectorAll('.fig-slot')].map(s=>+s.dataset.fig));
  const lead=document.createDocumentFragment();
  const links=[];
  figures.forEach((data,i)=>{
    if(placed.has(i)) return;
    const slot=document.createElement('div');
    slot.className='fig-slot';slot.dataset.fig=i;
    lead.append(slot);
  });
  const overview=lead.childElementCount;
  body.prepend(lead);
  let figNo=0;
  body.querySelectorAll('.fig-slot').forEach((slot,n)=>{
    const data=figures[+slot.dataset.fig];
    const fig=Fig.render(data,++figNo);
    fig.id='kb-figure-'+figNo;
    slot.replaceWith(fig);
    if(n<overview) links.push([2,fig.id,data.title]);
  });
  links.push(...r.toc);
  if(!painted){
    let hash=location.hash.slice(1);
    try{hash=decodeURIComponent(hash);}catch{}
    document.getElementById(hash)?.scrollIntoView();
    painted=true;
  }
  const toc=$('#toc');toc.textContent='';
  $('#toc-panel').hidden=!links.length;
  links.forEach(([lv,id,text])=>{
    const a=document.createElement('a');
    a.className='l'+lv;a.href='#'+id;a.textContent=text;
    toc.appendChild(a);
  });
  $('#md').value=d.md||'';
  $('#foot').hidden=!d.md;
  $('#notes').innerHTML=inline(notes||'「工程推断」表示作者依据公开材料作出的判断。');
  spy();
}

function spy(){
  if(io)io.disconnect();
  const links=[...document.querySelectorAll('#toc a')];
  const map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
  io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(!e.isIntersecting)return;
      links.forEach(a=>a.classList.remove('on'));
      const a=map.get(e.target.id);
      if(a)a.classList.add('on');
    });
  },{rootMargin:'-76px 0px -70% 0px',threshold:0});
  map.forEach((_,id)=>{const target=document.getElementById(id);if(target)io.observe(target);});
}

async function load(){
  if(!SLUG){$('#title').textContent='缺少参数 p';banner('网址里需要带 ?p=<知识页标识>，例如 article.html?p=deepinfer');return;}
  const {data,error}=await sb.from('pages_blocks').select('*').eq('page',PAGE).order('sort');
  if(error){$('#title').textContent='读取失败';banner('读取失败：'+error.message);return;}
  row=data?.find(record=>record.section==='article')||null;
  if(!row){$('#title').textContent='这页还没有内容';
    banner('Supabase 里没有 page='+PAGE+' 的记录。点「编辑」可以直接写入第一版。');
    row={id:null,page:PAGE,section:'article',sort:0,data:{}};paint({md:''});return;}
  const figures=typeof Fig==='undefined'?[]:data
    .filter(record=>record.section==='figure'&&Fig.isFigure(record.data)&&!Fig.validate(record.data).length)
    .map(record=>record.data);
  const notes=data.find(record=>record.section==='notes')?.data?.body;
  paint(row.data||{},figures,typeof notes==='string'?notes:'');
}
$('#toggle').onclick=()=>{
  const on=document.body.classList.toggle('edit');
  $('#toggle').classList.toggle('on',on);
  $('#toggle').textContent=on?'预览':'编辑';
};
$('#cancel').onclick=()=>{
  $('#md').value=(row&&row.data&&row.data.md)||'';
  $('#toggle').click();
};
$('#save').onclick=async()=>{
  const md=$('#md').value;
  const d=Object.assign({},(row&&row.data)||{},{md:md});
  let error;
  if(row&&row.id){({error}=await sb.from('pages_blocks').update({data:d}).eq('id',row.id));}
  else{({error}=await sb.from('pages_blocks').insert({page:PAGE,section:'article',sort:0,data:d}));}
  if(error){banner('保存失败：'+error.message);return;}
  $('#banner').hidden=true;
  await load();
  if(document.body.classList.contains('edit'))$('#toggle').click();
};
$('#export').onclick=()=>{
  const md=(row&&row.data&&row.data.md)||$('#md').value||'';
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(SLUG||'article')+'.md';
  a.click();
};

sb.channel('kb-'+PAGE)
  .on('postgres_changes',{event:'*',schema:'public',table:'pages_blocks'},()=>{
    if(!document.body.classList.contains('edit'))load();
  })
  .subscribe();
if(matchMedia('(max-width: 900px)').matches)$('#toc-panel').open=false;
load();
</script>
</body>
</html>
